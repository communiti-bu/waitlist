<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join our waitlist!</title>
    
    <link rel="icon" type="image/png" href="assets/favicons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicons/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Communiti" />
    <link rel="manifest" href="assets/favicons/site.webmanifest" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  
  <body>
    <div id="loadingScreen" class="loading-screen">
      <div class="loader"></div>
    </div>

    <header class="header">
      <div class="logo">
        <a href="/">
          <img src="assets/logo.png" alt="Communiti Logo" />
        </a>
      </div>
    </header>

    <div class="main-content">
      <div class="container">
        <h1>
          Your College,<br />
          Your <em id="dynamic-text">Community</em>.
        </h1>

        <p class="subtitle">
          Discover clubs, events, and student communities at Boston University through an
          intuitive platform designed just for you. Get personalized recommendations,
          connect with club leaders, and never miss an opportunity to engage on campus.
        </p>

        <form id="waitlistForm" class="waitlist-form">
          <div class="input-group">
            <input
              type="email"
              id="email"
              placeholder="Your email address"
              required
            />
            <button type="submit">
              Join waitlist <span class="arrow">→</span>
            </button>
          </div>
          <div id="message" class="message"></div>
        </form>
      </div>
      
      <div class="app-preview">
        <img src="assets/app-mockup.png" alt="App Mockup Preview" />
      </div>
    </div>

    <footer>© <span id="currentYear"></span> Communiti</footer>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
  </body>
</html>
